<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipeline editor (dev harness) — wissel</title>
    <!-- Dev only (`bun run dev`). The real editor is mounted inside the
         board shell (src/api/public/board.html), which supplies these
         colour tokens; this is the board's light set, enough to see the
         canvas while iterating. `vite build` doesn't use this file. -->
    <style>
      :root {
        --surface: #fcfcfb; --page: #f9f9f7; --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
        --line: #e1e0d9; --border: rgba(11, 11, 11, 0.10); --critical: #d03b3b; --accent: #4a3aa7; --accent-wash: rgba(74, 58, 167, 0.10);
      }
      body { margin: 0; padding: 14px 20px; background: var(--page); color: var(--ink-1); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #pe-dev-root .pe-app { height: calc(100vh - 28px); }
    </style>
  </head>
  <body>
    <div id="pe-dev-root"></div>
    <script type="module">
      import { mountPipelineEditor } from "/src/main.tsx";

      // #/pipelines/edit/<id> or anything else (a new pipeline), like the board.
      function routeFromHash() {
        const m = location.hash.match(/^#\/pipelines\/edit\/([^/]+)\/?$/);
        return m ? { mode: "edit", pipelineId: decodeURIComponent(m[1]) } : { mode: "new" };
      }
      const host = {
        setRoute(route) {
          history.replaceState(null, "", route.mode === "edit" ? `#/pipelines/edit/${encodeURIComponent(route.pipelineId)}` : "#/pipelines/new");
        },
        runPipeline(pipelineId) {
          window.open(`/board#/pipelines`, "_blank");
        },
      };
      let n = 0;
      const handle = mountPipelineEditor(document.getElementById("pe-dev-root"), { route: routeFromHash(), host, key: String(n) });
      window.addEventListener("hashchange", () => handle.update({ route: routeFromHash(), host, key: String(++n) }));
    </script>
  </body>
</html>
