# Execution harnesses wissel can run work under — a tool (which CLI)
# plus an account (which authenticated identity), distinct from
# agents/manifest.yaml's fleet (what kind of work gets done). `env` is a
# pointer to an already-authenticated local profile, never a secret
# value itself — see docs/SDD-execution-harnesses.md §2.
#
# You don't need to list every account here: wissel auto-detects every
# already-authenticated `.claude*` profile under $HOME at startup (see
# src/core/harness-discovery.ts) and layers this file on top. An entry
# here with an id matching a detected account overrides it (rename its
# label, disable it, repoint its env); an entry with no matching
# detected account is kept as a manual-only harness. Delete this file
# entirely and detected accounts still show up with an auto-generated
# label (their account email).
#
# claude-personal below is kept as a demonstration of that override: it
# pins a friendlier label than auto-detection would generate on its own.
#
# Optional `maxConcurrent: N` (positive integer) caps how many tasks run
# on a harness at once; at the cap it counts as busy and isn't picked.
# Unset means unlimited. To cap an auto-detected account, add a full
# entry for it here (an entry replaces the detected one, it doesn't merge).
#
# Agents choose harnesses from this file by id: an agent's
# `harnesses: [id, ...]` list in agents/manifest.yaml is an ordered
# preference. When none of its harnesses is enabled and under
# maxConcurrent, its tasks wait; they never run on an unlisted harness.
# An id there that doesn't exist here, or has the wrong tool, stops
# startup. See docs/SDD-agent-harness-preference.md.
harnesses:
  - id: claude-personal
    tool: claude-cli
    label: "Claude — personal"
    enabled: true
    env:
      CLAUDE_CONFIG_DIR: "/Users/milton.cyrus/.claude-personal"
  - id: codex-personal
    tool: codex-cli
    label: "Codex — personal"
    enabled: false
    env:
      # Absolute, not "~/.codex" — env vars passed to a spawned process
      # never get shell tilde-expansion, so a literal "~" doesn't resolve
      # and validateHarness disables the entry as unauthenticated. Same
      # convention claude-personal's CLAUDE_CONFIG_DIR above already uses.
      CODEX_HOME: "/home/mcyrus/.codex"
  - id: claude-adevinta
    tool: claude-cli
    label: Claude — milton.cyrus@adevinta.com
    enabled: true
    env:
      CLAUDE_CONFIG_DIR: /home/mcyrus/.claude-adevinta
  - id: anthropic-api
    tool: anthropic-api
    label: Anthropic API
    enabled: true
    apiKeyEnv: ANTHROPIC_API_KEY
  - id: codex
    tool: codex-cli
    label: codex
    enabled: true
    env:
      CODEX_HOME: /home/mcyrus/.codex
  - id: claude
    tool: claude-cli
    label: Claude — milton.cyrus@gmail.com
    enabled: false
    env:
      CLAUDE_CONFIG_DIR: /home/mcyrus/.claude
