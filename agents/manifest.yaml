# The fleet — agents and skills both. `kind` distinguishes a full task
# handler (agent) from a narrower, more mechanical capability (skill);
# both route and dispatch identically, kind is a label, not a separate
# code path. `description` is what it IS; `whenToUse` is what should land
# there. The router reads whenToUse and tags; the fleet view reads all of
# it. inputs/outputs/costProfile/trustLevel/toolAccess are the capability
# contract — data the router and the cost view both read, defined before
# any routing logic touches it.
agents:
  - id: triager
    name: Triager
    kind: agent
    tier: readonly
    description: Turns raw input into a structured task card.
    whenToUse: Unstructured input with no labels yet — an issue, a note, a dump.
    tags: [intake, unstructured]
    executor: readonly
    handoffs: [planner]
    inputs: [raw-text, issue]
    outputs: [task-card]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.03 }

  - id: planner
    name: Planner
    kind: agent
    tier: readonly
    description: Decomposes a vague card into subtasks with acceptance criteria.
    whenToUse: Card describes an outcome but not the steps to get there.
    tags: [planning, decomposition]
    executor: readonly
    # No `handoffs` list here on purpose. A subtask-plan agent's children
    # (spawnSubtasksFromPlan, src/core/orchestrator.ts) and any
    # auto-integrator follow-up spawned under them carry `parentTaskId`
    # for grouping/dependency tracking only, not a real handoff
    # relationship — resolveHandoffAllowlist exempts any parent whose
    # `outputContractFormat` is "subtask-plan" from the handoffs
    # restriction entirely, since a subtask's `labels` can legitimately
    # route it to any agent in the registry (fixer, integrator,
    # pr-description-writer, ...), not a fixed graph declared in advance.
    inputs: [task-card]
    outputs: [subtask-cards, acceptance-criteria]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.08 }
    # Same mechanism as reviewer's own outputContractFormat below —
    # declaring this is what makes a run's final message get parsed by
    # parseSubtaskPlan (src/executors/parse-subtask-plan.ts) instead of
    # trusted as prose (see src/executors/claude-cli.ts). The planner
    # stays readonly/plan-mode — it never gets Bash, write tier, or a
    # "create task" tool of its own — so this is the ONLY way its
    # decomposition ever becomes real cards: the orchestrator
    # (spawnSubtasksFromPlan, src/core/orchestrator.ts) deterministically
    # parses the block and calls board.create() itself, the same way a
    # human used to read the planner's prose and hand-create each
    # subtask.
    outputContractFormat: subtask-plan
    outputContract: |
      Output contract — mandatory, machine-parsed, no exceptions:

      You are running in plan mode. You cannot create cards, run
      commands, or edit files yourself — the fenced block below is your
      entire deliverable. If it's missing or malformed, your decomposition
      is silently discarded and nothing gets built.

      Your final message MUST end with a fenced code block of exactly
      this form, and nothing may follow it:

      ```subtask-plan
      [
        {"title": "...", "body": "...", "labels": ["..."]},
        {"title": "...", "body": "...", "labels": ["..."], "dependsOnIndex": 0}
      ]
      ```

      Rules:
      - The block must be valid JSON on its own: a top-level array, no
        trailing commas, no comments, no code fences nested inside it.
      - Every item needs a non-empty string `title`, a string `body`, and
        a `labels` array of strings.
      - `body` must be fully self-contained. A fresh implementer session
        sees ONLY its own card — not this plan, not sibling cards, not
        your reasoning above. Restate every acceptance criterion,
        file/function reference, and constraint that subtask needs,
        rather than referring back to "the plan" or "subtask 3".
      - Order items so dependencies only ever point backward: `dependsOnIndex`,
        when present, is the array index (0-based) of another item that
        must land first, and it must be strictly less than this item's
        own index. A forward or self-referencing index is invalid and
        fails the whole plan — reorder the array instead.
      - Choose `labels` to route each subtask to the right agent, using
        this repo's existing tag conventions (see the `tags:` on other
        agents in this file) — e.g. `["code"]` for implementer-bound
        work, `["ci", "tests", "bugfix"]` for fixer-bound work,
        `["docs", "pr"]` for a PR-description subtask. A subtask with no
        matching tag lands on `no-match` and never runs.
      - Write your normal decomposition prose first if you want, but the
        ```subtask-plan``` block must be the last thing in your message.
        A missing, malformed, or extra block after it is treated as a
        failed run, not a partial plan — never omit it or leave it
        ambiguous "to be safe."

  - id: reviewer
    name: Reviewer
    kind: agent
    tier: readonly
    description: Reviews a diff against repo conventions and prior decisions.
    whenToUse: A branch or PR exists and needs review before merge.
    tags: [review, quality, security]
    executor: readonly
    inputs: [diff, pull-request]
    outputs: [review-comments, approval-decision]
    trustLevel: medium
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.12 }
    # This isn't just documentation of the shape below — declaring
    # outputContract is what makes a run's final message get parsed by
    # parseReviewVerdict (src/executors/parse-review-verdict.ts) instead
    # of trusted as prose (see src/executors/claude-cli.ts). Combined
    # with any write-tier agent listing "reviewer" in its own
    # `handoffs` (see e.g. implementer below), this is also what turns
    # on the automated push-back loop: a write-tier success queues a
    # reviewer pass instead of stopping for a human, changes_requested
    # spawns a pushback re-attempt (up to 5 times) or escalates, and
    # approve resumes the normal done/review decision. None of that
    # wiring is implementer-specific — it lives in `finishResult`/
    # `handleReviewVerdict` (src/core/orchestrator.ts) and keys only off
    # `handoffs.includes("reviewer")` plus this contract existing on
    # whatever agent id is being handed off to. A future write-tier
    # agent (fixer, integrator, ...) that adds `reviewer` to its own
    # `handoffs` list gets this entire behavior for free, no code
    # changes required. Full state machine and verdict/lineage contract:
    # docs/SDD-review-handoff.md.
    # Pairs with outputContract below — this is what actually turns on
    # parseReviewVerdict's strict machine-parsing in runClaude
    # (src/executors/claude-cli.ts). See AgentDef.outputContractFormat's
    # own doc comment for why this is a separate field from
    # outputContract itself (memory-curator below has an outputContract
    # too, but deliberately no outputContractFormat).
    outputContractFormat: review-verdict
    outputContract: |
      Output contract — mandatory, machine-parsed, no exceptions:

      Your final message MUST end with a fenced code block of exactly
      this form, and nothing may follow it:

      ```review-verdict
      {"verdict": "approve", "feedback": "..."}
      ```

      or

      ```review-verdict
      {"verdict": "changes_requested", "feedback": "..."}
      ```

      Rules:
      - `verdict` must be exactly "approve" or "changes_requested" — no
        other value, no synonyms, no omission.
      - `feedback` is a plain string summarizing your review (what you
        checked, and — for changes_requested — exactly what must change).
      - The block must be valid JSON on its own: no trailing commas, no
        comments, no code fences nested inside it.
      - Write your normal prose review first if you want, but the
        ```review-verdict``` block must be the last thing in your
        message. A missing, malformed, or extra block after it is
        treated as a failed review, not an approval — never omit it or
        leave it ambiguous "to be safe."
    verificationContract: |
      You run under `--permission-mode plan` — Bash, Edit, Write, and
      every other side-effecting tool are unavailable to you here by
      design, not a sandbox glitch (see `ReadOnlyExecutor`,
      `src/executors/readonly.ts`). Never attempt `git add`, `git
      commit`, `git push`, or any other write — deliver your verdict
      from reading the diff alone, and never treat a write denial as a
      concern to flag or a blocker to work around.

  - id: pipeline-reviewer
    name: Pipeline reviewer
    kind: agent
    tier: readonly
    description: Reviews a diff against repo conventions and prior decisions — the pipeline-engine counterpart to `reviewer`,
      for a review step running inside a PipelineDef (src/core/pipeline-runner.ts) instead of the hardcoded review-handoff
      loop.
    whenToUse: A review step inside a pipeline run — never the hardcoded loop, which uses `reviewer`
      (outputContractFormat -- review-verdict) instead.
    # Deliberately NOT tagged [review, quality, security] like `reviewer`
    # — pipeline-runner.ts never routes a step through the fuzzy Router at
    # all (it looks the agent up directly by `step.agentId`, and every
    # step task it creates carries `labels: []`, see runStepAndSuccessors/
    # startPipelineRun in src/core/pipeline-runner.ts), so this agent's
    # tags do nothing for pipeline execution. They DO still feed the real
    # Router for anything else on the board — confirmed live, the hard
    # way: giving this agent `reviewer`'s own tags broke
    # spawnReviewerTask's follow-up routing (a plain `labels: ["review"]`
    # task, used by the completely untouched hardcoded loop), turning a
    # previously-unique tag match into a tie that routed to neither agent
    # (test/orchestrator.test.ts's "a follow-up under a parent whose agent
    # never declared handoffs routes unrestricted" caught this). One
    # unique tag, not shared with any other agent in this file, is what
    # keeps this addition from ever touching that unrelated routing path.
    tags: [pipeline-review-step]
    executor: readonly
    inputs: [diff, pull-request]
    outputs: [review-comments, approval-decision]
    trustLevel: medium
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.12 }
    # A separate agent id from `reviewer` on purpose — not an oversight,
    # not an accidental duplicate. outputContractFormat is a static,
    # per-agent field (see AgentDef.outputContractFormat,
    # src/core/types.ts): `reviewer` must keep emitting review-verdict
    # forever, because the hardcoded loop (finishResult's
    # `handoffs.includes("reviewer")` branch -> handleReviewVerdict,
    # src/core/orchestrator.ts) parses it with parseReviewVerdict and
    # nothing else. A pipeline "choose" step instead needs the generic
    # pipeline-handoff contract (docs/SDD-pipelines.md §3.4) so
    # pipeline-runner.ts can resolve `next` against the step's own
    # outgoing edges. Reusing `reviewer`'s id here would force every
    # ordinary (non-pipeline) reviewer run through pipeline-handoff
    # parsing too, or vice versa — either way breaking one of the two
    # callers. See docs/SDD-pipelines.md's Subtask 5 comparison section.
    outputContractFormat: pipeline-handoff
    outputContract: |
      Output contract — mandatory, machine-parsed, no exceptions:

      Your final message MUST end with a fenced code block of exactly
      this form, and nothing may follow it:

      ```pipeline-handoff
      {"next": "approve", "note": "..."}
      ```

      or

      ```pipeline-handoff
      {"next": "retry", "note": "..."}
      ```

      or

      ```pipeline-handoff
      {"next": "escalate", "note": "..."}
      ```

      Rules:
      - `next` must be exactly one of "approve", "retry", or "escalate" —
        no other value, no synonyms, no omission. These match this
        pipeline's own edge labels for your step — the only values that
        are actually valid to pick right now. Picking one that isn't a
        real outgoing edge from this exact step fails the whole run
        closed; it does not fall back to a guess.
      - "approve": the diff is acceptable as-is.
      - "retry": the diff needs changes, AND this task's own title says a
        retry step is available ("retry is available if you request
        changes"). Read the task title above carefully — it always tells
        you which attempt number this is and whether retry is an option.
      - "escalate": the diff needs changes, AND this task's own title
        says this is the FINAL attempt with no retry step left. Do not
        pick "retry" on the final attempt — there is no further
        implementer step to route to, and doing so fails the run instead
        of escalating it the way it should.
      - `note` is a plain string carrying your review feedback — for
        "retry", this is what the next implementer attempt will read
        (nonce-fenced as untrusted data, see docs/SDD-pipelines.md §3.5),
        so make it specific and actionable, exactly like `reviewer`'s own
        feedback field.
      - The block must be valid JSON on its own: no trailing commas, no
        comments, no code fences nested inside it.
      - Write your normal prose review first if you want, but the
        ```pipeline-handoff``` block must be the last thing in your
        message. A missing, malformed, or extra block after it is
        treated as a failed run, not an approval — never omit it or
        leave it ambiguous "to be safe."
    verificationContract: |
      You run under `--permission-mode plan` — Bash, Edit, Write, and
      every other side-effecting tool are unavailable to you here by
      design, not a sandbox glitch (see `ReadOnlyExecutor`,
      `src/executors/readonly.ts`). Never attempt `git add`, `git
      commit`, `git push`, or any other write — deliver your verdict
      from reading the diff alone, and never treat a write denial as a
      concern to flag or a blocker to work around.

  - id: repo-briefer
    name: Repo briefer
    kind: agent
    tier: readonly
    description: Builds and maintains the repo context document.
    whenToUse: A repo is new to the fleet, or its conventions have drifted.
    tags: [context, docs]
    executor: readonly
    inputs: [repo]
    outputs: [context-doc]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.15 }

  - id: memory-curator
    name: Memory curator
    kind: agent
    tier: readonly
    description: Dedups and promotes session lessons into durable memory.
    whenToUse: Scheduled housekeeping, not task-triggered.
    tags: [memory, housekeeping]
    executor: readonly
    inputs: [session-lessons]
    outputs: [memory-entries]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.05 }
    # Declaring `outputs: [memory-entries]` above is what makes
    # finishResult (src/core/orchestrator.ts) write this agent's raw
    # `result.summary` to memory/lessons.md, wholesale, replacing
    # whatever was there — no hardcoded agent id, keyed only off this
    # contract (see docs/SDD-memory-curator.md §9). That makes the
    # format of the final message load-bearing in a way no other
    # readonly agent's output is: a stray "Here's the curated memory:"
    # preamble would get written into the one file injected into every
    # future agent's prompt (src/core/prompt.ts) and stay there until
    # the next curation run. This outputContract exists to prevent
    # exactly that. Deliberately no outputContractFormat — unlike
    # reviewer, this isn't a machine-parsed JSON shape, just formatting
    # discipline; runClaude trusts the raw message as-is either way (see
    # AgentDef.outputContractFormat, src/core/types.ts).
    outputContract: |
      Output contract — mandatory, no exceptions:

      Your final message becomes the literal, wholesale replacement for
      memory/lessons.md. It is written to that file byte for byte,
      nothing added and nothing stripped.

      Rules:
      - Your final message must contain ONLY the curated markdown
        content for memory/lessons.md — nothing else.
      - No preamble, no conversational wrapper, no sign-off ("Here's
        the curated memory", "I've deduped the lessons below", "Let me
        know if...", etc). The first character of your final message
        must be the first character of the actual curated content.
      - Do not wrap the content in a fenced code block — the file
        itself is markdown, not a code sample to display.
      - You were given the current memory/lessons.md contents (if any)
        as part of your input, specifically so you can dedup and
        consolidate against it — merge new lessons into the existing
        structure rather than appending blindly, and drop anything
        that's stale, redundant, or superseded.
      - If there is nothing worth keeping at all (no prior file and no
        durable lesson from this batch), your final message must still
        be valid, minimal markdown for the file — never empty output
        and never an explanatory sentence about why there's nothing to
        write.

      Structure — every lesson is a topic, and every topic follows this
      exact two-part shape (the board UI's Memory tab parses on it, see
      parseMemoryTopics in src/api/public/board.html — a topic that
      doesn't follow this shape still displays, just without a
      drilldown split):

      ## <short topic title>
      <ELI5 summary: one paragraph, plain language, no jargon, as if
      explaining to someone who's never seen this codebase. This is
      the ONLY thing shown by default — it must stand alone and
      actually convey the lesson, not just tease that more detail
      exists.>

      <Detail: everything else about this topic — the mechanism, the
      exact files/functions involved, why it matters, what broke
      without it. Shown only on drilldown (expand). Can be as long
      and as technical as the lesson needs.>

      The ELI5 paragraph and the detail are separated by a single
      blank line, same as every other paragraph break in markdown —
      no special marker needed, the topic heading plus "first
      paragraph vs. rest" is the whole contract. A topic with nothing
      beyond its ELI5 paragraph is fine — omit the detail rather than
      padding it out.

  - id: implementer
    name: Implementer
    kind: agent
    tier: write
    description: Writes code for a card with clear acceptance criteria.
    whenToUse: Card has clear acceptance criteria and needs code written.
    tags: [code, typescript, python, node]
    executor: handoff
    handoffs: [reviewer]
    inputs: [task-card]
    outputs: [diff]
    trustLevel: high
    # Milton: merge automatically once the reviewer approves — no human
    # click needed for a clean approve. finishResult's autoMerge branch
    # (src/core/orchestrator.ts) only takes this path after a real
    # `verdict: "approve"`, and tryAutoMerge falls back to the normal
    # human "review" gate on any merge conflict — never force-merges.
    # A changes_requested verdict is unaffected: still pushback/escalate
    # as before, this only removes the click for an already-clean pass.
    autoMerge: true
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.60 }
    # verificationContract — see AgentDef.verificationContract and
    # WriteExecutor's matching --allowedTools grant
    # (src/executors/write.ts). Only takes effect together with that
    # allowlist; the two are declared in separate files but must stay in
    # sync (the allowlist is what makes running these two commands
    # actually possible under acceptEdits, which otherwise gates Bash
    # behind an approval prompt no headless run can answer).
    verificationContract: |
      Before reporting done, run:
        bun run typecheck
        bun test test/
      If either fails, fix it and re-run both — do not report done with
      either one red. If a failure is pre-existing and clearly unrelated
      to your change (confirm this by checking whether it also fails on
      a clean checkout before your edits), say so explicitly in your
      summary instead of silently leaving it broken.

      Do not run `git add`, `git commit`, or `git push` — that is
      deliberately not available to you here, not a sandbox glitch to
      route around. Landing your changes happens automatically when a
      human merges this work (`POST /tasks/:id/merge` already runs `git
      add -A` + `git commit` against whatever you leave in the worktree,
      using the task title as the message — see
      `mergeTaskWorktree`/`src/services/worktree.ts`). Report your
      status from the code and tests alone; do not treat a git-write
      denial as a concern to flag or a blocker to work around.
    # Declaring "reviewer" here (not implementer-specific — see the
    # comment on reviewer.outputContract above) is the whole trigger for
    # the automated push-back loop: a successful run lands on
    # pending-review instead of review, and only reaches a human after
    # the reviewer approves, or rejects it enough times to escalate.

  - id: fixer
    name: Fixer
    kind: agent
    tier: write
    description: Narrow loop — CI failed or a test broke, make it green.
    whenToUse: A specific failure exists with a clear signal to fix.
    tags: [ci, tests, bugfix]
    executor: handoff
    inputs: [failure-signal]
    outputs: [diff]
    trustLevel: high
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.35 }

  - id: integrator
    name: Integrator
    kind: agent
    tier: write
    description: Rebases, resolves conflicts, merges. Also verifies a completed set of subtasks fits together — the
      cross-cutting integration pass a per-subtask reviewer structurally can't perform (see
      wireAutoIntegrator/maybeSpawnIntegrator, src/core/orchestrator.ts).
    whenToUse: Work is complete but does not land cleanly, OR every subtask under a parent card has landed and needs a
      combined check before the parent is considered done.
    # "integration" is what the auto-created follow-up card
    # (maybeSpawnIntegrator) carries as its label — must overlap this
    # list for the router to dispatch it with confidence.
    tags: [merge, rebase, conflict, integration]
    executor: handoff
    inputs: [branch]
    outputs: [merged-branch]
    trustLevel: high
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.25 }

  # --- skills: narrower, more mechanical, cheaper than a full agent ---

  - id: commit-message-drafter
    name: Commit message drafter
    kind: skill
    tier: readonly
    description: Writes a conventional commit message from a staged diff.
    whenToUse: A diff exists and needs a commit message, nothing more.
    tags: [git, commit]
    executor: api
    inputs: [diff]
    outputs: [commit-message]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.01 }

  - id: pr-description-writer
    name: PR description writer
    kind: skill
    tier: readonly
    description: Drafts a pull request description from a diff and its task card.
    whenToUse: A branch is ready to open as a PR and needs a description.
    tags: [docs, pr]
    executor: api
    inputs: [diff, task-card]
    outputs: [pr-description]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.02 }

  - id: changelog-writer
    name: Changelog writer
    kind: skill
    tier: readonly
    description: Turns a batch of merged commits into a changelog entry.
    whenToUse: A release is being cut and needs its changelog written.
    tags: [docs, changelog, release]
    executor: api
    inputs: [commits]
    outputs: [changelog-entry]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.03 }

  - id: quick-answer
    name: Quick answer
    kind: skill
    tier: readonly
    description: Answers a self-contained question with no repo or file access — a direct call to the Anthropic API, not claude-cli.
    whenToUse: A general question, definition, or explanation that needs nothing from the repo — the task's title/body is the whole input.
    tags: [question, explain, define]
    executor: api
    inputs: [question]
    outputs: [answer]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.01 }

  - id: lint-fixer
    name: Lint fixer
    kind: skill
    tier: write
    description: Runs the repo's linter and applies only its auto-fixes.
    whenToUse: Lint is failing and the fix is mechanical, not a design call.
    tags: [lint, style]
    executor: handoff
    inputs: [repo]
    outputs: [diff]
    trustLevel: medium
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.05 }
