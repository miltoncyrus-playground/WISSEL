# The fleet — agents and skills both. `kind` distinguishes a full task
# handler (agent) from a narrower, more mechanical capability (skill);
# both route and dispatch identically, kind is a label, not a separate
# code path. `description` is what it IS; `whenToUse` is what should land
# there. The router reads whenToUse and tags; the fleet view reads all of
# it. inputs/outputs/costProfile/trustLevel/toolAccess are the capability
# contract — data the router and the cost view both read, defined before
# any routing logic touches it.
agents:
  - id: triager
    name: Triager
    kind: agent
    tier: readonly
    description: Turns raw input into a structured task card.
    whenToUse: Unstructured input with no labels yet — an issue, a note, a dump.
    tags: [intake, unstructured]
    executor: readonly
    handoffs: [planner]
    inputs: [raw-text, issue]
    outputs: [task-card]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.03 }

  - id: planner
    name: Planner
    kind: agent
    tier: readonly
    description: Decomposes a vague card into subtasks with acceptance criteria.
    whenToUse: Card describes an outcome but not the steps to get there.
    tags: [planning, decomposition]
    executor: readonly
    # integrator added alongside the auto-integrator feature
    # (wireAutoIntegrator/maybeSpawnIntegrator, src/core/orchestrator.ts):
    # its auto-created follow-up card carries parentTaskId = the planner
    # task, so without integrator in this allowlist,
    # resolveHandoffAllowlist would restrict that card's routing
    # candidates to exactly [implementer, reviewer] and it would always
    # land on no-match regardless of tag overlap. See
    # docs/SDD-pipeline-automation.md §3.5.
    handoffs: [implementer, reviewer, integrator]
    inputs: [task-card]
    outputs: [subtask-cards, acceptance-criteria]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.08 }

  - id: reviewer
    name: Reviewer
    kind: agent
    tier: readonly
    description: Reviews a diff against repo conventions and prior decisions.
    whenToUse: A branch or PR exists and needs review before merge.
    tags: [review, quality, security]
    executor: readonly
    inputs: [diff, pull-request]
    outputs: [review-comments, approval-decision]
    trustLevel: medium
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.12 }
    # This isn't just documentation of the shape below — declaring
    # outputContract is what makes a run's final message get parsed by
    # parseReviewVerdict (src/executors/parse-review-verdict.ts) instead
    # of trusted as prose (see src/executors/claude-cli.ts). Combined
    # with any write-tier agent listing "reviewer" in its own
    # `handoffs` (see e.g. implementer below), this is also what turns
    # on the automated push-back loop: a write-tier success queues a
    # reviewer pass instead of stopping for a human, changes_requested
    # spawns a pushback re-attempt (up to 5 times) or escalates, and
    # approve resumes the normal done/review decision. None of that
    # wiring is implementer-specific — it lives in `finishResult`/
    # `handleReviewVerdict` (src/core/orchestrator.ts) and keys only off
    # `handoffs.includes("reviewer")` plus this contract existing on
    # whatever agent id is being handed off to. A future write-tier
    # agent (fixer, integrator, ...) that adds `reviewer` to its own
    # `handoffs` list gets this entire behavior for free, no code
    # changes required. Full state machine and verdict/lineage contract:
    # docs/SDD-review-handoff.md.
    # Pairs with outputContract below — this is what actually turns on
    # parseReviewVerdict's strict machine-parsing in runClaude
    # (src/executors/claude-cli.ts). See AgentDef.outputContractFormat's
    # own doc comment for why this is a separate field from
    # outputContract itself (memory-curator below has an outputContract
    # too, but deliberately no outputContractFormat).
    outputContractFormat: review-verdict
    outputContract: |
      Output contract — mandatory, machine-parsed, no exceptions:

      Your final message MUST end with a fenced code block of exactly
      this form, and nothing may follow it:

      ```review-verdict
      {"verdict": "approve", "feedback": "..."}
      ```

      or

      ```review-verdict
      {"verdict": "changes_requested", "feedback": "..."}
      ```

      Rules:
      - `verdict` must be exactly "approve" or "changes_requested" — no
        other value, no synonyms, no omission.
      - `feedback` is a plain string summarizing your review (what you
        checked, and — for changes_requested — exactly what must change).
      - The block must be valid JSON on its own: no trailing commas, no
        comments, no code fences nested inside it.
      - Write your normal prose review first if you want, but the
        ```review-verdict``` block must be the last thing in your
        message. A missing, malformed, or extra block after it is
        treated as a failed review, not an approval — never omit it or
        leave it ambiguous "to be safe."

  - id: repo-briefer
    name: Repo briefer
    kind: agent
    tier: readonly
    description: Builds and maintains the repo context document.
    whenToUse: A repo is new to the fleet, or its conventions have drifted.
    tags: [context, docs]
    executor: readonly
    inputs: [repo]
    outputs: [context-doc]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.15 }

  - id: memory-curator
    name: Memory curator
    kind: agent
    tier: readonly
    description: Dedups and promotes session lessons into durable memory.
    whenToUse: Scheduled housekeeping, not task-triggered.
    tags: [memory, housekeeping]
    executor: readonly
    inputs: [session-lessons]
    outputs: [memory-entries]
    trustLevel: low
    toolAccess: [read]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.05 }
    # Declaring `outputs: [memory-entries]` above is what makes
    # finishResult (src/core/orchestrator.ts) write this agent's raw
    # `result.summary` to memory/lessons.md, wholesale, replacing
    # whatever was there — no hardcoded agent id, keyed only off this
    # contract (see docs/SDD-memory-curator.md §9). That makes the
    # format of the final message load-bearing in a way no other
    # readonly agent's output is: a stray "Here's the curated memory:"
    # preamble would get written into the one file injected into every
    # future agent's prompt (src/core/prompt.ts) and stay there until
    # the next curation run. This outputContract exists to prevent
    # exactly that. Deliberately no outputContractFormat — unlike
    # reviewer, this isn't a machine-parsed JSON shape, just formatting
    # discipline; runClaude trusts the raw message as-is either way (see
    # AgentDef.outputContractFormat, src/core/types.ts).
    outputContract: |
      Output contract — mandatory, no exceptions:

      Your final message becomes the literal, wholesale replacement for
      memory/lessons.md. It is written to that file byte for byte,
      nothing added and nothing stripped.

      Rules:
      - Your final message must contain ONLY the curated markdown
        content for memory/lessons.md — nothing else.
      - No preamble, no conversational wrapper, no sign-off ("Here's
        the curated memory", "I've deduped the lessons below", "Let me
        know if...", etc). The first character of your final message
        must be the first character of the actual curated content.
      - Do not wrap the content in a fenced code block — the file
        itself is markdown, not a code sample to display.
      - You were given the current memory/lessons.md contents (if any)
        as part of your input, specifically so you can dedup and
        consolidate against it — merge new lessons into the existing
        structure rather than appending blindly, and drop anything
        that's stale, redundant, or superseded.
      - If there is nothing worth keeping at all (no prior file and no
        durable lesson from this batch), your final message must still
        be valid, minimal markdown for the file — never empty output
        and never an explanatory sentence about why there's nothing to
        write.

  - id: implementer
    name: Implementer
    kind: agent
    tier: write
    description: Writes code for a card with clear acceptance criteria.
    whenToUse: Card has clear acceptance criteria and needs code written.
    tags: [code, typescript, python, node]
    executor: handoff
    handoffs: [reviewer]
    inputs: [task-card]
    outputs: [diff]
    trustLevel: high
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.60 }
    # verificationContract — see AgentDef.verificationContract and
    # WriteExecutor's matching --allowedTools grant
    # (src/executors/write.ts). Only takes effect together with that
    # allowlist; the two are declared in separate files but must stay in
    # sync (the allowlist is what makes running these two commands
    # actually possible under acceptEdits, which otherwise gates Bash
    # behind an approval prompt no headless run can answer).
    verificationContract: |
      Before reporting done, run:
        bun run typecheck
        bun test test/
      If either fails, fix it and re-run both — do not report done with
      either one red. If a failure is pre-existing and clearly unrelated
      to your change (confirm this by checking whether it also fails on
      a clean checkout before your edits), say so explicitly in your
      summary instead of silently leaving it broken.
    # Declaring "reviewer" here (not implementer-specific — see the
    # comment on reviewer.outputContract above) is the whole trigger for
    # the automated push-back loop: a successful run lands on
    # pending-review instead of review, and only reaches a human after
    # the reviewer approves, or rejects it enough times to escalate.

  - id: fixer
    name: Fixer
    kind: agent
    tier: write
    description: Narrow loop — CI failed or a test broke, make it green.
    whenToUse: A specific failure exists with a clear signal to fix.
    tags: [ci, tests, bugfix]
    executor: handoff
    inputs: [failure-signal]
    outputs: [diff]
    trustLevel: high
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.35 }

  - id: integrator
    name: Integrator
    kind: agent
    tier: write
    description: Rebases, resolves conflicts, merges. Also verifies a completed set of subtasks fits together — the
      cross-cutting integration pass a per-subtask reviewer structurally can't perform (see
      wireAutoIntegrator/maybeSpawnIntegrator, src/core/orchestrator.ts).
    whenToUse: Work is complete but does not land cleanly, OR every subtask under a parent card has landed and needs a
      combined check before the parent is considered done.
    # "integration" is what the auto-created follow-up card
    # (maybeSpawnIntegrator) carries as its label — must overlap this
    # list for the router to dispatch it with confidence.
    tags: [merge, rebase, conflict, integration]
    executor: handoff
    inputs: [branch]
    outputs: [merged-branch]
    trustLevel: high
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.25 }

  # --- skills: narrower, more mechanical, cheaper than a full agent ---

  - id: commit-message-drafter
    name: Commit message drafter
    kind: skill
    tier: readonly
    description: Writes a conventional commit message from a staged diff.
    whenToUse: A diff exists and needs a commit message, nothing more.
    tags: [git, commit]
    executor: api
    inputs: [diff]
    outputs: [commit-message]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.01 }

  - id: pr-description-writer
    name: PR description writer
    kind: skill
    tier: readonly
    description: Drafts a pull request description from a diff and its task card.
    whenToUse: A branch is ready to open as a PR and needs a description.
    tags: [docs, pr]
    executor: api
    inputs: [diff, task-card]
    outputs: [pr-description]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.02 }

  - id: changelog-writer
    name: Changelog writer
    kind: skill
    tier: readonly
    description: Turns a batch of merged commits into a changelog entry.
    whenToUse: A release is being cut and needs its changelog written.
    tags: [docs, changelog, release]
    executor: api
    inputs: [commits]
    outputs: [changelog-entry]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.03 }

  - id: quick-answer
    name: Quick answer
    kind: skill
    tier: readonly
    description: Answers a self-contained question with no repo or file access — a direct call to the Anthropic API, not claude-cli.
    whenToUse: A general question, definition, or explanation that needs nothing from the repo — the task's title/body is the whole input.
    tags: [question, explain, define]
    executor: api
    inputs: [question]
    outputs: [answer]
    trustLevel: low
    toolAccess: []
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.01 }

  - id: lint-fixer
    name: Lint fixer
    kind: skill
    tier: write
    description: Runs the repo's linter and applies only its auto-fixes.
    whenToUse: Lint is failing and the fix is mechanical, not a design call.
    tags: [lint, style]
    executor: handoff
    inputs: [repo]
    outputs: [diff]
    trustLevel: medium
    toolAccess: [read, write, bash]
    costProfile: { model: claude-sonnet-5, estUsdPerTask: 0.05 }
